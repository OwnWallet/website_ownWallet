name: "✨ Đề xuất tính năng mới (Feature Request)"
description: Đề xuất ý tưởng hoặc cải tiến mới cho ứng dụng OwnWallet
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã đóng góp ý tưởng cho OwnWallet!

  - type: textarea
    id: problem
    attributes:
      label: Vấn đề bạn đang gặp phải hoặc bối cảnh cần cải tiến
      description: Tính năng này giải quyết nhu cầu hay trở ngại gì của bạn?
      placeholder: "Ví dụ: Tôi muốn có biểu đồ so sánh chi tiêu theo tháng..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Đề xuất giải pháp
      description: Mô tả chi tiết tính năng bạn muốn có và cách hoạt động mong muốn.
      placeholder: "Thêm một tab so sánh trong trang Báo cáo..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Các phương án thay thế khác đã cân nhắc
      description: Bạn đã thử giải pháp nào khác chưa?
    validations:
      required: false
